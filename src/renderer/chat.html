<!doctype html>
<meta charset="utf-8" />
<title>Navi</title>
<style>
  /* The window is transparent and frameless; the card below is the whole visible surface, so
     the body only provides the margin its shadow needs. */
  html,
  body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #e9e9ef;
    -webkit-user-select: none;
    user-select: none;
  }

  #card {
    box-sizing: border-box;
    height: 100%;
    margin: 8px;
    display: flex;
    flex-direction: column;
    border-radius: 14px;
    background: rgba(22, 23, 30, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    /* Frameless: this strip is how the window is moved. */
    -webkit-app-region: drag;
  }

  /* The tint is the fairy's own colour for her current state, pushed from the main process. */
  #dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #8890a8;
    flex: none;
    transition: background 400ms ease;
  }
  #dot.busy {
    animation: pulse 1.1s ease-in-out infinite;
  }
  /* Listening is a faster pulse and a ring, so it does not read as the same state as thinking. */
  #dot.listening {
    animation: pulse 0.6s ease-in-out infinite;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18);
  }
  @keyframes pulse {
    50% {
      opacity: 0.35;
    }
  }

  /* The approval affordance (NAV-101). Quiet until you look for it, and gone once used. */
  .approval {
    display: flex;
    gap: 4px;
    margin-top: 6px;
    opacity: 0.35;
    transition: opacity 150ms ease;
  }
  .msg:hover .approval,
  .approval:focus-within {
    opacity: 1;
  }
  .approval.used {
    opacity: 0.5;
    font-size: 11px;
  }
  .approval button {
    border: 0;
    border-radius: 6px;
    padding: 1px 6px;
    font: inherit;
    line-height: 1.4;
    background: rgba(255, 255, 255, 0.07);
  }
  .approval button:hover {
    background: rgba(255, 255, 255, 0.16);
  }

  #mood {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #b9bdcc;
  }

  /* Whether what you type leaves the machine. Never left to be guessed at. */
  #provider {
    flex: none;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    color: #9aa2b8;
    background: rgba(255, 255, 255, 0.06);
  }
  #provider.remote {
    color: #ffd9a8;
    background: rgba(255, 168, 61, 0.16);
  }

  #settings {
    -webkit-app-region: no-drag;
    flex: none;
    border: 0;
    border-radius: 6px;
    padding: 2px 5px;
    font: inherit;
    line-height: 1;
    color: var(--dim, #8b91a4);
    background: transparent;
  }
  #settings:hover {
    color: #e9e9ef;
    background: rgba(255, 255, 255, 0.08);
  }

  #transcript {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    -webkit-user-select: text;
    user-select: text;
  }

  .msg {
    max-width: 84%;
    padding: 7px 10px;
    border-radius: 11px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user {
    align-self: flex-end;
    background: rgba(120, 150, 255, 0.19);
  }
  .msg.navi {
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.07);
  }
  .msg.error {
    align-self: stretch;
    color: #ffc2c2;
    background: rgba(255, 90, 90, 0.13);
  }
  .msg.note {
    align-self: center;
    font-size: 11px;
    color: #8b91a4;
    background: none;
    padding: 0;
  }

  #empty {
    margin: auto;
    color: #767c8e;
    text-align: center;
    padding: 0 24px;
  }

  footer {
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    padding: 8px;
  }

  #input {
    box-sizing: border-box;
    width: 100%;
    max-height: 96px;
    resize: none;
    border: 0;
    border-radius: 9px;
    padding: 8px 10px;
    color: inherit;
    font: inherit;
    background: rgba(255, 255, 255, 0.07);
    -webkit-user-select: text;
    user-select: text;
  }
  #input:focus {
    outline: 1px solid rgba(140, 165, 255, 0.55);
  }
  #input:disabled {
    opacity: 0.55;
  }

  #hint {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 3px 0;
    font-size: 11px;
    color: #767c8e;
  }
  #status {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>

<div id="card">
  <header>
    <div id="dot"></div>
    <div id="mood">…</div>
    <div id="provider">…</div>
    <button id="settings" type="button" title="Settings (⌘,)" aria-label="Settings">⚙</button>
  </header>
  <div id="transcript"><div id="empty">Say something to her.</div></div>
  <footer>
    <textarea id="input" rows="1" placeholder="Talk to Navi…" autofocus></textarea>
    <div id="hint">
      <span id="status"></span>
      <span id="keys">↵ send · ⇧↵ newline · esc close</span>
    </div>
  </footer>
</div>

<script type="module" src="./chat.js"></script>
