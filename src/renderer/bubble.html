<!doctype html>
<meta charset="utf-8" />
<title>Navi</title>
<style>
  /* Transparent and frameless, like the chat window; the card is the whole visible surface. */
  html,
  body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #e9e9ef;
    -webkit-user-select: none;
    user-select: none;
  }

  #card {
    box-sizing: border-box;
    height: 100%;
    margin: 6px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    border-radius: 14px;
    background: rgba(22, 23, 30, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    opacity: 0;
    transform: translateY(2px);
    transition:
      opacity 180ms ease,
      transform 180ms ease;
  }
  #card.shown {
    opacity: 1;
    transform: none;
  }

  #text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  #buttons {
    display: flex;
    gap: 6px;
  }
  #buttons button {
    flex: none;
    border: 0;
    border-radius: 8px;
    padding: 4px 10px;
    font: inherit;
    background: rgba(255, 255, 255, 0.1);
    color: inherit;
  }
  #buttons button:hover {
    background: rgba(255, 255, 255, 0.18);
  }

  /* The collapsed state (NAV-112): a dot, not a card, and never itself the reason a reminder
     mattered less. */
  #marker {
    display: none;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: rgba(255, 191, 0, 0.85);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
  }

  body.collapsed #card {
    display: none;
  }
  body.collapsed #marker {
    display: block;
  }

  /* Reduced motion removes the animation, never the bubble itself. The media query is the OS
     saying so; `.reduced-motion` is the app setting saying so even when the OS does not
     (NAV-113 deferral) — either is enough, so the two rules just repeat the same declaration. */
  @media (prefers-reduced-motion: reduce) {
    #card {
      transition: none;
    }
  }
  body.reduced-motion #card {
    transition: none;
  }
</style>

<div id="card">
  <div id="text"></div>
  <div id="buttons"></div>
</div>
<div id="marker"></div>

<script>
  const card = document.getElementById('card');
  const text = document.getElementById('text');
  const buttons = document.getElementById('buttons');

  // A short cue for an unprompted remark, when the sound setting is on (NAV-113 deferral). Just
  // a tone, not an asset: this window has no audio file of its own to ship or load.
  function chime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.32);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.32);
    } catch {
      // No audio output, or the platform refused it. A missed chime costs nothing the bubble
      // itself was not already saying.
    }
  }

  window.naviBubble.onShow((message) => {
    document.body.classList.remove('collapsed');
    text.textContent = message.text;
    buttons.replaceChildren(
      ...message.buttons.map((b) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = b.label;
        button.addEventListener('click', () => window.naviBubble.action(b.id));
        return button;
      }),
    );
    // Rendered before the transition-in runs; a class toggled on the same frame it is added
    // never transitions.
    requestAnimationFrame(() => card.classList.add('shown'));
    if (message.sound) chime();
  });

  window.naviBubble.onCollapse(() => {
    card.classList.remove('shown');
    document.body.classList.add('collapsed');
  });

  // The app-level reduced-motion override (NAV-113 deferral). Pushed on load and on every
  // settings save; see `main/bubble-window.ts#setReducedMotion`.
  window.naviBubble.onReducedMotion((on) => {
    document.body.classList.toggle('reduced-motion', on);
  });
</script>
