# CI for the Electron port (NAV-82).
#
# NAV-82 was written against the Godot suite and deliberately sequenced after the platform
# decision, so that CI would not be built around a stack that might be retired. NAV-94 retired
# it: the root Godot app still runs, but nothing new is written against it and its suite keeps
# the one failing test and the engine-error noise NAV-82 catalogued. This covers `app/`, which
# is where the work is.
#
# The whole suite is offline — no display, no network, no model. That is a property worth
# keeping: a check that needs Ollama running is a check that goes red for reasons that are not
# about the code.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here needs to write to the repository.
permissions:
  contents: read

# A superseded run on the same branch is wasted work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci
        env:
          # The `electron` package's postinstall downloads a ~150MB binary that nothing here
          # uses: the tests are Electron-free by design and the build marks electron external.
          # Skipping it removes a slow, network-dependent step and the partial-download failure
          # mode documented in app/README.md.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
