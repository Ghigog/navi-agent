# CI (NAV-82).
#
# One suite, because there is one app. NAV-82 was written against the Godot suite and
# deliberately sequenced after the platform decision, so CI would not be built around a stack
# that might be retired; NAV-94 chose the replacement and NAV-105 deleted the original.
#
# The whole suite is offline — no display, no network, no model. That is a property worth
# keeping: a check that needs Ollama running is a check that goes red for reasons that are not
# about the code.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here needs to write to the repository.
permissions:
  contents: read

# A superseded run on the same branch is wasted work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: typecheck, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci
        env:
          # The `electron` package's postinstall downloads a ~150MB binary that nothing here
          # uses: the tests are Electron-free by design and the build marks electron external.
          # Skipping it removes a slow, network-dependent step and the partial-download failure
          # mode documented in README.md.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
